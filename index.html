<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fffdf8;--ink:#1c1b19;--mute:#7b7468;--line:#ebe3d4;--brand:#1f3a34;--brand2:#2d5a4f;--gold:#c09553;--good:#2f7a55;--bad:#c0473a;
--serif:Fraunces,Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--r:22px;--shadow:0 1px 2px #0000000a,0 14px 34px -14px #1f3a3430}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}
.hero{position:relative;color:#fbf6ec;padding:28px 20px 96px;overflow:hidden;background:linear-gradient(160deg,#16302a 0%,#1f3a34 45%,#3d5a4a 100%)}
.hero svg.bgart{position:absolute;inset:auto 0 0 0;width:100%;height:150px;opacity:.9}
.top{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto;position:relative}
.brand{font:700 14px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.sync{font-size:12px;padding:5px 10px;border-radius:999px;background:#ffffff1a;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#7fd6a4;box-shadow:0 0 0 3px #7fd6a433}
.dot.off{background:#e0b25c;box-shadow:0 0 0 3px #e0b25c33}
.herobody{max-width:1040px;margin:26px auto 0;position:relative;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.herobody h1{font:600 clamp(38px,6.4vw,66px)/1 var(--serif);margin:0;letter-spacing:-.02em}
.herobody .meta{opacity:.85;margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.count{margin-left:auto;text-align:center;background:#ffffff14;border:1px solid #ffffff26;border-radius:20px;padding:14px 22px;backdrop-filter:blur(6px)}
.count b{display:block;font:600 44px/1 var(--serif);color:#f3d9a8}
.count span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.avs{display:flex;margin-top:14px;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);color:#fff;border:2px solid #1f3a34;margin-left:-8px}
.av:first-child{margin-left:0}
.av.sm{width:22px;height:22px;font-size:10px;border-width:1.5px;border-color:#fff;margin:0}
main{max-width:1040px;margin:-62px auto 0;padding:0 14px 120px;position:relative}
nav{display:flex;gap:4px;overflow-x:auto;position:sticky;top:10px;z-index:20;background:#fffdf8ee;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);scrollbar-width:none}
nav button{flex:1;min-width:86px;border:0;background:none;border-radius:999px;padding:9px 10px;font:600 13px var(--sans);color:var(--mute);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.2s}
nav button i{font-style:normal;font-size:19px;line-height:1.1}
nav button.on{background:var(--brand);color:#fbf6ec}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin:18px 0;box-shadow:var(--shadow);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font:600 26px/1.15 var(--serif);letter-spacing:-.01em}
h3{margin:0;font:600 19px/1.25 var(--serif)}
.note{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:#fff;color:var(--ink);transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px #c0955322}
.btn{background:var(--brand);color:#fbf6ec;border:0;border-radius:999px;padding:12px 20px;font-weight:600;transition:.2s;display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-size:14px}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px #1f3a34aa}
.btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,#c09553,#a87a3a);color:#fff}
.btn.ai{background:linear-gradient(135deg,#6d5bd0,#c45a9a);color:#fff}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.5;transform:none}
.ib{border:0;background:none;color:#b8ad9a;font-size:18px;padding:4px 6px;border-radius:8px}
.ib:hover{background:#f3ece0;color:var(--ink)}
.fab{position:fixed;right:20px;bottom:22px;z-index:30;width:62px;height:62px;border-radius:50%;border:0;font-size:30px;color:#fff;background:linear-gradient(135deg,#c09553,#a87a3a);box-shadow:0 14px 30px -8px #a87a3aaa;transition:.2s}
.fab:hover{transform:scale(1.06) rotate(90deg)}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:#f3ece0;color:var(--mute)}
.tag.g{background:#e5f2ea;color:var(--good)}.tag.y{background:#f8ecd6;color:#8a6424}.tag.p{background:#ece8fb;color:#5b49b8}
.empty{text-align:center;padding:34px 16px}.empty .big{font-size:52px}
/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.stat .e{font-size:24px}.stat b{display:block;font:600 28px/1.1 var(--serif);margin-top:6px}.stat .note{font-size:12px}
/* week strip */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:10px;overflow-x:auto;padding:4px 2px 8px}
.wd{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;transition:.2s;text-align:left}
.wd:hover,.wd.on{border-color:var(--gold);transform:translateY(-2px)}
.wd .n{font:600 22px var(--serif)}.wd .d{font-size:12px;color:var(--mute)}
.bars{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#f1ebdf;margin-top:10px}
.bars span{display:block;height:100%}
.emo{font-size:15px;margin-top:6px;min-height:20px;letter-spacing:2px}
/* timeline */
.tl{position:relative;margin-top:16px}
.stop{display:grid;grid-template-columns:62px 48px 1fr;gap:12px;align-items:start;position:relative}
.stop .time{font:700 14px var(--sans);text-align:right;padding-top:12px;color:var(--ink)}
.stop .time small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.bub{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;position:relative;z-index:1;box-shadow:0 6px 14px -8px #0006}
.sbody{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:4px;transition:.2s}
.sbody:hover{border-color:#d9cdb6}
.sbody .t{font:600 17px var(--serif)}
.leg{display:grid;grid-template-columns:62px 48px 1fr;gap:12px;min-height:44px}
.leg .line{justify-self:center;width:3px;background:repeating-linear-gradient(to bottom,#cbbd9f 0 6px,transparent 6px 12px)}
.leg .info{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute);padding:8px 0}
.pill{background:#f3ece0;border-radius:999px;padding:4px 10px;font-weight:600;color:var(--ink);font-size:12px}
.mlink{font-size:12px;font-weight:700;text-decoration:none;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:#fff}
.mlink.g{color:#1a73e8}.mlink.a{color:#111}
.dayhead{border-radius:var(--r);padding:20px 22px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:-24px -24px 6px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.dayhead .big{font:600 34px/1 var(--serif)}
.daytabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.daytabs button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.daytabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hours{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#ffffff33;flex:1;min-width:140px}
/* hotels */
.hotel{border:1.5px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0;background:var(--card);box-shadow:var(--shadow);animation:up .35s both}
.hotel.chosen{border-color:var(--gold);background:linear-gradient(#fffdf8,#fffaf0)}
.cmp{display:grid;gap:10px;margin-top:14px}
.cmpr{display:grid;grid-template-columns:100px 1fr 120px;gap:10px;align-items:center}
.cmpr .bar{height:30px;border-radius:10px;background:#f1ebdf;overflow:hidden;position:relative}
.cmpr .bar span{position:absolute;inset:0 auto 0 0;border-radius:10px;display:flex;align-items:center;padding-left:10px;color:#fff;font-weight:700;font-size:13px;transition:width .5s}
.cmpr input{padding:8px 10px;text-align:right;font-weight:700}
.logo{font-weight:800;font-size:14px}
/* food */
.fd{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ring{width:72px;height:72px}
.meter{height:8px;border-radius:99px;background:#f1ebdf;overflow:hidden;margin-top:8px;max-width:260px}
.meter span{display:block;height:100%;background:linear-gradient(90deg,#e8c27a,#c0473a)}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:600;font-size:14px;transition:.2s;display:flex;gap:8px;align-items:center}
.chip:hover,.chip.on{border-color:var(--gold);background:#fbf3e4;transform:translateY(-1px)}
.idea{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px;animation:up .4s both}
.ideas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
/* pack */
.chk{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--good)}
.chk.done span{text-decoration:line-through;color:var(--mute)}
.prog{height:12px;border-radius:99px;background:#f1ebdf;overflow:hidden}.prog span{display:block;height:100%;background:linear-gradient(90deg,#5aa77d,#2f7a55);transition:width .5s}
/* modal */
.scrim{position:fixed;inset:0;background:#1c1b1966;backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:26px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px -20px #0008;animation:up .25s}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}
.cat i{display:block;font-style:normal;font-size:26px}
.cat.on{border-color:var(--ink);background:#f6f0e4}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;font-weight:600;font-size:14px;animation:up .25s;box-shadow:0 10px 30px #0004}
.who{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.banner{background:#fff6e2;border:1px solid #efd9a8;color:#7a5a1c;border-radius:16px;padding:12px 16px;font-size:13px;margin:14px 0}
.donut{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.legend div{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
@media(max-width:640px){.card{padding:18px}.dayhead{margin:-18px -18px 6px}.stop,.leg{grid-template-columns:46px 40px 1fr;gap:8px}.bub{width:40px;height:40px;font-size:20px;border-radius:13px}.cmpr{grid-template-columns:76px 1fr 96px}.count{margin-left:0}.fd{grid-template-columns:60px 1fr}.fd>:last-child{grid-column:1/-1}.ring{width:58px;height:58px}}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}

<script>
// ================= helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const enc=encodeURIComponent;
const CATS={sight:['🏯','Sightseeing','#c8553d'],fun:['🎢','Theme park','#e09f3e'],animals:['🐬','Zoo & aquarium','#3a7ca5'],museum:['🧪','Museum','#7b5ea7'],
 nature:['🌳','Park & nature','#4f8a5a'],food:['🍽','Meal','#b08d57'],shop:['🛍','Shopping','#d16ba5'],relax:['♨️','Relax','#5c8d89'],move:['🚆','Getting there','#6b7488'],other:['📍','Other','#8a8172']};
const MODES={driving:['🚗','Rental car','d'],transit:['🚌','Bus & monorail','r'],walking:['🚶','Walk','w']};
const DAYC=['#c8553d','#3a7ca5','#7b5ea7','#4f8a5a','#d16ba5','#e09f3e','#2d5a4f','#8a6424'];
const PALETTE=['#c8553d','#3a7ca5','#7b5ea7','#4f8a5a','#d16ba5','#e09f3e','#2d5a4f'];

// ================= state =================
const DEF_TRIP={dest:'Okinawa',start:'2026-12-20',end:'2026-12-26',adults:2,kids:2,ages:'6,9',rooms:1,cur:'¥',mode:'driving'};
const D={trip:{...DEF_TRIP},hotels:{},food:{},items:{},packing:{},saved:{},members:{}};
let me=null,online=false,readOnly=false,demo=false,gate='loading',FBU=null,owner=null,isOwner=false,profiles={},unsubs=[],gerr='';
let tab=(location.hash||'#home').slice(1),selDay=0,ideas=[],ideaCat=null,aiBusy='',pendingRender=false;const SEARCH=true;const previews=new Set();
const COLLS=['hotels','food','items','packing','saved'];
const T=()=>D.trip;
const kidAges=()=>{const a=String(T().ages||'').split(',').filter(x=>x!=='');return [...Array(+T().kids||0).keys()].map(k=>+(a[k]??6))};
const kidsTxt=()=>`${T().kids} kids${+T().kids?' (ages '+kidAges().join(', ')+')':''}`;
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2))};
const nights=()=>Math.max(1,Math.round((new Date(T().end)-new Date(T().start))/864e5)||1);
const nDays=()=>nights()+1;
const people=()=>(+T().adults||0)+(+T().kids||0);
const money=n=>T().cur+Math.round(+n||0).toLocaleString();
const dayD=i=>{const d=new Date(T().start+'T00:00');d.setDate(d.getDate()+i);return d};
const dayLabel=(i,o={weekday:'short',month:'short',day:'numeric'})=>dayD(i).toLocaleDateString(undefined,o);
const list=c=>Object.entries(D[c]).map(([id,v])=>({id,...v}));
const dayItems=i=>list('items').filter(x=>+x.day===i).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const chosenHotel=()=>list('hotels').find(h=>h.chosen);
const best=h=>{const p=[['Agoda',+h.agoda],['Trip.com',+h.trip],['Direct',+h.other]].filter(x=>x[1]>0).sort((a,b)=>a[1]-b[1]);return p};
const toMin=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+(m||0)};
const fromMin=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtDur=m=>m>=60?`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`:`${m} min`;
function toast(t){$('#toast').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',2600)}

// ================= data layer (Firebase) =================
const fb=()=>window.FB;
const dref=(c,id)=>fb().doc(fb().db,c,id);
async function write(coll,id,data,keep){
  const body=keep?{...data}:{...data,by:me||data.by||null,at:Date.now()};
  if(coll==='trip'){D.trip={...D.trip,...body}}else D[coll][id]=body;
  render();
  if(demo)return;
  try{await fb().setDoc(coll==='trip'?dref('trip','main'):dref(coll,id),coll==='trip'?D.trip:body)}
  catch(e){toast(e.code==='permission-denied'?"You don't have permission to change this":'Could not save, please try again')}
}
async function remove(coll,id){
  delete D[coll][id];render();
  if(demo)return;
  try{await fb().deleteDoc(dref(coll,id))}catch(e){toast('Could not delete')}
}
function applyRemote(fn){fn();const a=document.activeElement;if(a&&a.closest&&a.closest('#view,#modal')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!document.activeElement?.closest?.('#view,#modal')){pendingRender=false;render()}},50));
const myEmail=()=>(FBU?.email||'').toLowerCase();
window.onAuth=async u=>{
  if(demo)return;unsubs.forEach(f=>f());unsubs=[];FBU=u;owner=null;isOwner=false;
  if(!u){gate='signin';setSync(false);render();return}
  me=u.uid;gate='loading';render();
  fb().setDoc(dref('profiles',u.uid),{name:u.displayName||'',photo:u.photoURL||'',email:myEmail()}).catch(()=>{});
  profiles[u.uid]={name:u.displayName||'',photo:u.photoURL||'',email:myEmail()};
  try{
    const o=await fb().getDoc(dref('config','owner'));
    if(!o.exists()){gate='create';render();return}
    owner=o.data();isOwner=owner.uid===u.uid;
    if(!isOwner){const m=await fb().getDoc(dref('members',myEmail()));if(!m.exists()){gate='denied';render();return}}
    gate='ok';listen();render();
  }catch(e){gerr=e.code||e.message||'';gate=e.code==='permission-denied'?'denied':'error';render()}
};
async function signIn(){try{await fb().signIn()}catch(e){toast('Sign-in did not finish: '+(e.code||'try again'))}}
async function createTrip(){try{await fb().setDoc(dref('config','owner'),{uid:me,email:myEmail()});toast('🎉 Your family trip is ready');window.onAuth(FBU)}catch(e){toast('Could not create the trip: someone may have created it already');window.onAuth(FBU)}}
function listen(){
  const F=fb();let timer=setTimeout(()=>{if(!online)$('#banner').innerHTML='<div class="banner">⏳ Still connecting to the shared trip. What you see may be out of date.</div>'},10000);
  const seen=m=>{if(!m.fromCache){clearTimeout(timer);$('#banner').innerHTML='';setSync(true)}else if(!online)setSync(false)};
  const err=e=>{clearTimeout(timer);setSync(false);if(e.code==='permission-denied'){gate='denied';render()}};
  unsubs.push(F.onSnapshot(dref('trip','main'),s=>{seen(s.metadata);applyRemote(()=>{D.trip={...DEF_TRIP,...(s.exists()?s.data():{})}})},err));
  for(const c of [...COLLS,'members'])unsubs.push(F.onSnapshot(F.collection(F.db,c),s=>{seen(s.metadata);applyRemote(()=>{D[c]=Object.fromEntries(s.docs.map(x=>[x.id,{...x.data()}]))})},err));
  unsubs.push(F.onSnapshot(F.collection(F.db,'profiles'),s=>{s.docs.forEach(x=>profiles[x.id]=x.data());render()},()=>{}));
}
function setSync(on){online=on;$('#sync').innerHTML=demo?'<span class="dot off"></span>Demo mode':on?`<span class="dot"></span>Live · shared with family`:`<span class="dot off"></span>${gate==='ok'?'Offline · will sync':'Not signed in'}`}
const nameOf=id=>id===me?'You':(profiles[id]?.name||'Family member');
const colorOf=id=>PALETTE[[...String(id||'x')].reduce((a,c)=>a+c.charCodeAt(0),0)%PALETTE.length];
const avatar=(id,cls='')=>{const p=profiles[id]||{},n=nameOf(id),ph=/^https:\/\//.test(p.photo||'')?p.photo:'';
  return ph?`<img class="av ${cls}" src="${esc(ph)}" alt="" title="${esc(n)}" referrerpolicy="no-referrer">`:`<span class="av ${cls}" style="background:${colorOf(id)}" title="${esc(n)}">${esc(((p.name||n)||'?').slice(0,1).toUpperCase())}</span>`};
const who=x=>x.by?`<span class="who">${avatar(x.by,'sm')} ${esc(nameOf(x.by))}${x.at?' · '+ago(x.at):''}</span>`:'';
function ago(t){const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'}
const profByEmail=e=>Object.entries(profiles).find(([k,p])=>(p.email||'').toLowerCase()===String(e).toLowerCase());
let memList=[];
function vFamily(){memList=list('members').sort((a,b)=>(a.at||0)-(b.at||0));
  const op=owner?profByEmail(owner.email):null;
  const row=(email,pid,tag,k)=>`<div class="chk">${pid?avatar(pid):`<span class="av" style="background:#b8ad9a">${esc(String(email||'?').slice(0,1).toUpperCase())}</span>`}<span class="sp"><b>${esc(pid?profiles[pid].name||email:email)}</b><br><span class="note">${esc(email)}${pid?'':' · not signed in yet'}</span></span>${tag}${k!=null&&isOwner?`<button class="ib" title="Remove" onclick="removeMember(${k})">×</button>`:''}</div>`;
  return `<div class="card"><div class="row"><h2>👨‍👩‍👧 Family</h2><span class="sp"></span><span class="note">${memList.length+1} people can plan this trip</span></div>
   ${owner?row(owner.email,op?.[0],'<span class="tag y">Owner</span>'):''}
   ${memList.map((m,k)=>{const p=profByEmail(m.email);return row(m.email,p?.[0],'<span class="tag">Family</span>',k)}).join('')}
   ${isOwner||demo?`<div class="row" style="margin-top:14px"><input id="memail" type="email" placeholder="family member's Google email" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')addMember()"><button class="btn" onclick="addMember()">＋ Add</button></div>
   <p class="note">They open this website, tap "Sign in with Google" with that email, and see the same trip live.</p>`:'<p class="note">Only the owner can add or remove family members.</p>'}</div>`}

const stat=(e,l,v,s,c='',fs=28)=>`<div class="stat"><span class="e">${e}</span><b style="font-size:${fs}px">${v}</b><div class="note">${l}${s?' · '+s:''}</div></div>`;
function week(){return `<div class="week" style="margin-top:12px">${[...Array(nDays()).keys()].map(i=>{const it=dayItems(i);const used=it.reduce((a,x)=>a+(+x.dur||0)*60,0)+dayTravel(i);

  <text x="70" y="66" text-anchor="middle" font-family="Fraunces,serif" font-size="14" font-weight="600">${esc(money(tot))}</text><text x="70" y="84" text-anchor="middle" font-size="9" fill="#7b7468">total</text></svg>

function recent(){const all=COLLS.flatMap(c=>list(c).map(x=>({...x,c}))).filter(x=>x.at).sort((a,b)=>b.at-a.at).slice(0,6);if(!all.length)return '';

function parseLink(u){u=(u||'').trim();let lat=null,lng=null,name=null,url=null;try{url=new URL(u)}catch(e){}
  const m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m){lat=+m[1];lng=+m[2]}
  if(url){const p=url.searchParams;
    for(const k of ['ll','q','query','destination','daddr','coordinate','sll','center']){const v=p.get(k);if(!v)continue;const c=v.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if(c){if(lat==null){lat=+c[1];lng=+c[2]}}else if(!name&&['q','query','destination','daddr'].includes(k))name=v}
    const pm=url.pathname.match(/\/(?:place|search)\/([^/]+)/);if(pm&&!/^-?\d+\.\d+,/.test(decodeURIComponent(pm[1])))name=decodeURIComponent(pm[1].replace(/\+/g,' '));
    else if(pm&&lat==null){const c=decodeURIComponent(pm[1]).match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)/);if(c){lat=+c[1];lng=+c[2]}}
    if(!name)name=p.get('name')||p.get('address')||null}
  if(lat!=null&&(Math.abs(lat)>90||Math.abs(lng)>180)){lat=lng=null}
  return {lat,lng,name,short:!!url&&/(^|\.)(goo\.gl|g\.co|apple\.co)$/.test(url.host)}}
function parseLinks(text){const out=[];let pend=null;
  for(let line of String(text||'').split(/\n+/)){line=line.trim();if(!line)continue;const um=line.match(/https?:\/\/\S+/);
    if(!um){pend=line.replace(/^[-•*\s]+/,'').slice(0,120);continue}
    const before=line.slice(0,um.index).trim().replace(/[:\-–]+$/,'').trim();const r=parseLink(um[0]);r.name=r.name||before||pend;pend=null;if(r.lat!=null||r.name)out.push(r)}
  if(pend)out.push({name:pend,lat:null,lng:null});return out}
async function addSaved(arr,src){arr=arr.filter(x=>x&&(x.name||x.lat!=null)).slice(0,200);if(!arr.length)return toast('No places found in that');

  const miss=arr.filter(x=>x.lat==null).length;toast(`⭐ Added ${arr.length} place${arr.length>1?'s':''}${miss?` · ${miss} need a location`:''}`);
  if(miss)locateMissing()}

function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}
async function importFile(f){try{const t=await f.text();let arr=[];
  if(/\.kml$/i.test(f.name)){const d=new DOMParser().parseFromString(t,'text/xml');arr=[...d.getElementsByTagName('Placemark')].map(p=>{const c=(p.getElementsByTagName('coordinates')[0]?.textContent||'').trim().split(/\s+/)[0].split(',');return {name:p.getElementsByTagName('name')[0]?.textContent?.trim(),lat:c.length>1?+c[1]:null,lng:c.length>1?+c[0]:null,note:(p.getElementsByTagName('description')[0]?.textContent||'').replace(/<[^>]+>/g,' ').trim()}})}
  else if(/json$/i.test(f.name)){const j=JSON.parse(t);arr=(j.features||[]).map(ft=>{const pr=ft.properties||{},c=ft.geometry?.coordinates||[],ok=c.length>1&&(c[0]||c[1]);const l=parseLink(pr.google_maps_url||pr['Google Maps URL']||'');return {name:pr.Title||pr.name||pr.location?.name||pr.location?.address||l.name,lat:ok?+c[1]:l.lat,lng:ok?+c[0]:l.lng,note:pr.location?.address||pr.Note||''}})}
  else{const rows=csv(t);const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());const ti=h.indexOf('title'),ui=h.indexOf('url'),ni=h.indexOf('note');
    arr=rows.filter(r=>r[ti>=0?ti:0]).map(r=>{const l=parseLink((ui>=0&&ui===h.length-1?r.slice(ui).join(','):r[ui])||'');return {name:r[ti>=0?ti:0]||l.name,lat:l.lat,lng:l.lng,note:ni>=0?r[ni]:''}})}
  addSaved(arr,'file')}catch(e){toast("Couldn't read that file")}}

const PACK_SUGG=['Passports','Travel insurance','Phone chargers','Power adapter','Kids medicine','Snacks for the plane','Stroller','Tablet + headphones','Wet wipes','Rain jackets','Driving licence + International Driving Permit','Child car seats booked','Sunscreen','Swimwear & reef shoes','Cash'];
function vPack(){const pk=list('packing').sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.at||0)-(b.at||0)),d=pk.filter(x=>x.done).length;
  const have=new Set(pk.map(x=>x.text.toLowerCase()));
  return `<div class="card"><div class="row"><h2>Packing list</h2><span class="sp"></span><b style="font:600 22px var(--serif)">${pk.length?Math.round(d/pk.length*100):0}%</b></div>
   <div class="prog" style="margin:10px 0 16px"><span style="width:${pk.length?d/pk.length*100:0}%"></span></div>
   <div class="row ro"><input id="pk" placeholder="Add an item and press Enter" onkeydown="if(event.key==='Enter')addPack(this.value)"><button class="btn" onclick="addPack($('#pk').value)">Add</button></div>
   <div class="chips ro" style="margin-top:12px">${PACK_SUGG.filter(s=>!have.has(s.toLowerCase())).map(s=>`<button class="chip" style="padding:6px 12px;font-size:13px" onclick="addPack('${s}')">＋ ${s}</button>`).join('')}</div>
   <div style="margin-top:12px">${pk.map(x=>`<div class="chk ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} ${readOnly?'disabled':''} onchange="write('packing','${x.id}',{...D.packing['${x.id}'],done:this.checked})"><span class="sp">${esc(x.text)}</span>${who(x)}<button class="ib ro" onclick="remove('packing','${x.id}')">×</button></div>`).join('')||'<p class="note">Nothing yet: tap a suggestion above.</p>'}</div></div>`}
function addPack(t){t=(t||'').trim();if(!t)return;write('packing',uid(),{text:t,done:false});setTimeout(()=>{const i=$('#pk');if(i){i.value='';i.focus()}},30)}

// ================= SUMMARY =================
function vSummary(){
  const h=chosenHotel(),hp=h?best(h):[],it=list('items');
  const hotel=hp.length?hp[0][1]*nights():0,act=it.filter(x=>x.cat!=='food').reduce((a,x)=>a+(+x.cost||0),0),food=it.filter(x=>x.cat==='food').reduce((a,x)=>a+(+x.cost||0),0),total=hotel+act+food;
  const top=list('food').sort((a,b)=>(+b.score||0)-(+a.score||0)).slice(0,5);
  return `<div class="card"><div class="row"><div><h2>${esc(T().dest)} family trip</h2><p class="note">${dayLabel(0)} – ${dayLabel(nights())} · ${nights()} nights · ${T().adults} adults, ${kidsTxt()}</p></div><span class="sp"></span><button class="btn alt" onclick="print()">🖨 Print / PDF</button><button class="btn" onclick="copySummary()">📋 Copy to share</button></div>
   <div class="stats" style="margin-top:14px">${stat('📍','Stops',it.length,'')}${stat('🍣','Restaurants',list('food').length,'')}${stat('💴','Total',money(total),'')}${stat('👤','Per person',money(total/Math.max(1,people())),'')}</div></div>
  <div class="card"><h2>🏨 Where we stay</h2>${h?`<div class="row" style="margin-top:8px"><h3 style="font-size:22px">${esc(h.name)}</h3><span class="note">${esc(h.area||'')}</span></div>
   ${hp.length?`<p>Book on <b>${hp[0][0]}</b>: ${money(hp[0][1])}/night · <b>${money(hotel)}</b> total${hp.length>1&&hp[hp.length-1][1]>hp[0][1]?` <span class="tag g">saves ${money((hp[hp.length-1][1]-hp[0][1])*nights())} vs ${hp[hp.length-1][0]}</span>`:''}</p>`:''}`:'<p class="note">No hotel chosen yet.</p>'}</div>
  <div class="card"><h2>🗓 Day by day</h2>${[...Array(nDays()).keys()].map(i=>{const d=dayItems(i);const tm=legTimes(i);const tr=dayTravel(i);
   return `<div style="margin-top:16px"><div class="row"><b style="font:600 18px var(--serif)">Day ${i+1} · ${dayLabel(i,{weekday:'long',month:'short',day:'numeric'})}</b><span class="sp"></span>${tr?`<span class="tag">${MODES[T().mode][0]} ${fmtDur(tr)} travel</span>`:''}</div>
   ${d.length?d.map(x=>`<div class="chk"><b style="min-width:48px">${esc(x.time)}</b><span style="font-size:20px">${(CATS[x.cat]||CATS.other)[0]}</span><span class="sp">${esc(x.title)}${tm[x.id]?` <span class="note">· ${fmtDur(tm[x.id])} to get there</span>`:''}</span>${x.cost?`<span class="note">${money(x.cost)}</span>`:''}</div>`).join(''):'<p class="note">Free day</p>'}</div>`}).join('')}</div>
  ${top.length?`<div class="card"><h2>🍣 Top restaurants</h2>${top.map(foodRow).join('')}</div>`:''}
  <div class="card"><h2>💴 Budget</h2>${donut([['Hotel',hotel,'#1f3a34'],['Activities',act,'#c09553'],['Food',food,'#c8553d']])}<p class="note">Flights and local transport fares not included.</p></div>`}
async function copySummary(){
  const h=chosenHotel(),hp=h?best(h):[];
  let t=`🧳 ${T().dest} family trip\n${dayLabel(0)} – ${dayLabel(nights())} · ${T().adults} adults, ${kidsTxt()}\n`;
  if(h)t+=`\n🏨 ${h.name}${hp.length?` (best on ${hp[0][0]}: ${money(hp[0][1])}/night)`:''}\n`;
  for(let i=0;i<nDays();i++){const d=dayItems(i);t+=`\nDay ${i+1} · ${dayLabel(i)}\n`+(d.map(x=>`  ${x.time} ${(CATS[x.cat]||CATS.other)[0]} ${x.title}${legTimes(i)[x.id]?` (${fmtDur(legTimes(i)[x.id])} travel)`:''}`).join('\n')||'  Free day')+'\n'}
  try{await navigator.clipboard.writeText(t);toast('Copied: paste it into WhatsApp or LINE')}catch(e){modal(`<h2>Copy this text</h2><textarea rows="14" onfocus="this.select()">${esc(t)}</textarea><div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="modal()">Done</button></div>`)}
}
